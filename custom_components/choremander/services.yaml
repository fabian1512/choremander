        number:
          min: 1
          max: 10000
          mode: box
    reason:
      name: Reason
      description: Optional reason for the penalty
      required: false
      selector:
        text:

set_chore_order:
  name: Set Chore Order
  description: >-
    Set the order a child's chores appear in on their card. The reorder card
    calls this when a chore is dragged into a new position.
  fields:
    child_id:
      name: Child ID
      description: The ID of the child whose ordering is being set
      required: true
      selector:
        text:
    chore_order:
      name: Chore Order
      description: Chore IDs, in the order they should appear
      required: true
      selector:
        object:

set_chore_schedule:
  name: Set Chore Schedule
  description: >-
    Set which days a chore falls on and whose turn it is. Every field is
    optional and anything left out is kept as it is, so one call can change
    the rotation without disturbing the due days. Pass an empty list or an
    empty dictionary to clear a field.
  fields:
    chore_id:
      name: Chore ID
      description: The ID of the chore being scheduled
      required: true
      selector:
        text:
    due_days:
      name: Due Days
      description: >-
        Lowercase weekday names the chore falls on, for example
        ["monday", "friday"]. An empty list means every day.
      required: false
      selector:
        object:
    rotation:
      name: Rotation
      description: >-
        "none" for no rotation, "occurrence" to take turns each time the chore
        comes round, or "week" to give a whole week to one child at a time.
      required: false
      selector:
        select:
          options:
            - none
            - occurrence
            - week
    rotation_order:
      name: Rotation Order
      description: >-
        Child IDs, in the order they take turns. Empty falls back to the
        children the chore is assigned to.
      required: false
      selector:
        object:
    rotation_anchor:
      name: Rotation Anchor
      description: >-
        ISO date the rotation counts from, for example "2026-08-03". Change it
        to shift whose turn it is without reordering the children.
      required: false
      selector:
        text:
    day_overrides:
      name: Day Overrides
      description: >-
        Permanent per-weekday exceptions, as weekday name to child IDs - for
        example {"saturday": ["child_maya"]}. An empty list means nobody that
        day.
      required: false
      selector:
        object:
    date_overrides:
      name: Date Overrides
      description: >-
        One-off exceptions for a single date, as ISO date to child IDs - for
        example {"2026-08-08": ["child_krishna"]}. These win over every other
        rule, and entries more than 60 days old are dropped on save.
      required: false
      selector:
        object:

add_chore:
  name: Add Chore
  description: >-
    Create a new chore. Only the name is required; every other field falls
    back to its default. Schedule fields (due days, rotation and overrides)
    are written through the same code path as set_chore_schedule.
  fields:
    name:
      name: Name
      description: The name of the chore to create
      required: true
      selector:
        text:
    points:
      name: Points
      description: Points awarded on approval (default 10)
      required: false
      selector:
        number:
          min: 0
          max: 10000
          mode: box
    description:
      name: Description
      description: Optional description shown on the card
      required: false
      selector:
        text:
    assigned_to:
      name: Assigned To
      description: Child IDs the chore is assigned to, for example ["child_maya"]
      required: false
      selector:
        object:
    requires_approval:
      name: Requires Approval
      description: >-
        Whether a parent must approve each completion before points are
        awarded (default true)
      required: false
      selector:
        boolean:
    time_category:
      name: Time Category
      description: >-
        When the chore belongs in the day - morning, afternoon, evening,
        night or anytime (default anytime)
      required: false
      selector:
        text:
    daily_limit:
      name: Daily Limit
      description: How many times per day the chore can be completed (default 1)
      required: false
      selector:
        number:
          min: 1
          max: 100
          mode: box
    completion_sound:
      name: Completion Sound
      description: Sound played on completion (default coin)
      required: false
      selector:
        text:
    completion_percentage_per_month:
      name: Completion % Per Month
      description: >-
        Of the days the chore is due, how often it is expected to get done,
        100 meaning every time (default 100)
      required: false
      selector:
        number:
          min: 0
          max: 100
          mode: box
    due_days:
      name: Due Days
      description: >-
        Lowercase weekday names the chore falls on, for example
        ["monday", "friday"]. An empty list means every day.
      required: false
      selector:
        object:
    rotation:
      name: Rotation
      description: >-
        "none" for no rotation, "occurrence" to take turns each time the chore
        comes round, or "week" to give a whole week to one child at a time.
      required: false
      selector:
        select:
          options:
            - none
            - occurrence
            - week
    rotation_order:
      name: Rotation Order
      description: >-
        Child IDs, in the order they take turns. Empty falls back to the
        children the chore is assigned to.
      required: false
      selector:
        object:
    rotation_anchor:
      name: Rotation Anchor
      description: >-
        ISO date the rotation counts from, for example "2026-08-03". Change it
        to shift whose turn it is without reordering the children.
      required: false
      selector:
        text:
    day_overrides:
      name: Day Overrides
      description: >-
        Permanent per-weekday exceptions, as weekday name to child IDs - for
        example {"saturday": ["child_maya"]}. An empty list means nobody that
        day.
      required: false
      selector:
        object:
    date_overrides:
      name: Date Overrides
      description: >-
        One-off exceptions for a single date, as ISO date to child IDs - for
        example {"2026-08-08": ["child_krishna"]}. These win over every other
        rule, and entries more than 60 days old are dropped on save.
      required: false
      selector:
