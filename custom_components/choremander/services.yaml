update_chore:
  name: Update Chore
  description: >-
    Change the properties of an existing chore. Only the fields you pass are
    changed; everything else, including the schedule, is left alone. Renaming
    is done through the name field.
  fields:
    chore_id:
      name: Chore ID
      description: The ID of the chore to update
      required: true
      selector:
        text:
    name:
      name: Name
      description: New name for the chore
      required: false
      selector:
        text:
    description:
      name: Description
      description: New description for the chore
      required: false
      selector:
        text:
    points:
      name: Points
      description: New points value
      required: false
      selector:
        number:
          min: 0
          max: 10000
          mode: box
    assigned_to:
      name: Assigned To
      description: New list of child IDs the chore is assigned to
      required: false
      selector:
        object:
    requires_approval:
      name: Requires Approval
      description: New approval requirement
      required: false
      selector:
        boolean:
    time_category:
      name: Time Category
      description: New time of day - morning, afternoon, evening, night or anytime
      required: false
      selector:
        text:
    daily_limit:
      name: Daily Limit
      description: New daily completion limit
      required: false
      selector:
        number:
          min: 1
          max: 100
          mode: box
    completion_sound:
      name: Completion Sound
      description: New completion sound
      required: false
      selector:
        text:
    completion_percentage_per_month:
      name: Completion % Per Month
      description: New expected completion rate, 100 meaning every time
      required: false
      selector:
        number:
          min: 0
          max: 100
          mode: box

delete_chore:
  name: Delete Chore
  description: Delete an existing chore. Completed history is kept.
  fields:
    chore_id:
      name: Chore ID
      description: The ID of the chore to delete
      required: true
      selector:
        text:

